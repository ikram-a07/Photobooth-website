<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Photobooth Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="title">
        <img src="assets/title background new.png">
        <h1>Ikram's <br> Photobooth</h1>
    </div>
    <div class="middle">
        <div class="video-column">
           <div class="video">
              <video id="camera" autoplay></video>
           </div>
           <button class="capture">Capture 
            <img src="assets/camera icon.png">
           </button>
           
         </div>

          <button class="rewind">
            <img src="assets/new back arrow 2.png">
           </button>

       <div class="frame-column">
           <div class="picture">
           <img class="frame-image" src= "assets/Photobooth frame- new.png">
           </div>
           <button class="download">Download !</button>
        
       </div>

      
      
     </div>
   
          
 

    <script src="script.js"></script>
  </body>
</html>
